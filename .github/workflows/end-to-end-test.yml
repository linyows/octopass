name: End-to-end Testing

on:
  push:
    branches: [main]
    paths:
      - '**.zig'
      - '**.zig.zon'
      - 'packaging/**'
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build with cross compile
        run: zig build cross

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-out
          path: zig-out/
          retention-days: 1

  test:
    name: Test on ${{ matrix.distro }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu-resolute
          - ubuntu-noble
          - ubuntu-questing
          - debian-bookworm
          - debian-trixie
          - rockylinux-9
          - rockylinux-8
          - almalinux-9
          - almalinux-8
    # Run if:
    # 1. push to main or workflow_dispatch
    # 2. issue_comment with '/run-e2e' from maintainer on a PR
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run-e2e') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'))

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zig-out
          path: zig-out/

      - name: Build and test package
        working-directory: packaging
        env:
          OCTOPASS_TOKEN: ${{ secrets.OCTOPASS_TOKEN }}
          OCTOPASS_ORGANIZATION: ${{ secrets.OCTOPASS_ORGANIZATION }}
          OCTOPASS_TEAM: ${{ secrets.OCTOPASS_TEAM }}
        run: |
          docker compose build ${{ matrix.distro }}
          docker compose run --rm ${{ matrix.distro }}

      - name: Comment on success
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ E2E test passed successfully!'
            });
      - name: Comment on failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ E2E test failed. [View logs](${runUrl})`
            });
