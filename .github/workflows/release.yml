name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Update version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          sed -i.bak "s/\.version = \"[^\"]*\",/.version = \"${VERSION}\",/" build.zig.zon
          cat build.zig.zon

      - name: Build with cross compile
        run: zig build cross

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-out
          path: zig-out/
          retention-days: 1

  package:
    name: Package for ${{ matrix.distro }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-resolute
            type: deb
            pc_distro: ubuntu
            pc_version: resolute
          - distro: ubuntu-noble
            type: deb
            pc_distro: ubuntu
            pc_version: noble
          - distro: ubuntu-questing
            type: deb
            pc_distro: ubuntu
            pc_version: questing
          - distro: debian-bookworm
            type: deb
            pc_distro: debian
            pc_version: bookworm
          - distro: debian-trixie
            type: deb
            pc_distro: debian
            pc_version: trixie
          - distro: rockylinux-9
            type: rpm
            pc_distro: el
            pc_version: "9"
          - distro: rockylinux-8
            type: rpm
            pc_distro: el
            pc_version: "8"
          - distro: almalinux-9
            type: rpm
            pc_distro: el
            pc_version: "9"
          - distro: almalinux-8
            type: rpm
            pc_distro: el
            pc_version: "8"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zig-out
          path: zig-out/

      - name: Build package
        working-directory: packaging
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker compose build ${{ matrix.distro }}
          docker compose run --rm -e VERSION=$VERSION -e OCTOPASS_TOKEN= -e OCTOPASS_ORGANIZATION= -e OCTOPASS_TEAM= ${{ matrix.distro }} \
            sh -c "make -f Makefile.container info && make -f Makefile.container ${{ matrix.type }}_pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.distro }}
          path: packaging/dist/*
          retention-days: 5

  release:
    name: Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: List packages
        run: ls -la packages/

      - name: Generate checksums
        run: |
          cd packages
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload to GitHub Releases
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: packages/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  packagecloud:
    name: Upload to PackageCloud (${{ matrix.distro }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-resolute
            type: deb
            pc_distro: ubuntu
            pc_version: resolute
          - distro: ubuntu-noble
            type: deb
            pc_distro: ubuntu
            pc_version: noble
          - distro: ubuntu-questing
            type: deb
            pc_distro: ubuntu
            pc_version: questing
          - distro: debian-bookworm
            type: deb
            pc_distro: debian
            pc_version: bookworm
          - distro: debian-trixie
            type: deb
            pc_distro: debian
            pc_version: trixie
          - distro: rockylinux-9
            type: rpm
            pc_distro: el
            pc_version: "9"
          - distro: rockylinux-8
            type: rpm
            pc_distro: el
            pc_version: "8"

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ matrix.distro }}
          path: packages

      - name: Install package_cloud CLI
        run: |
          sudo gem install package_cloud

      - name: Upload to PackageCloud
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          for pkg in packages/*.${{ matrix.type }}; do
            if [ -f "$pkg" ]; then
              echo "Uploading $pkg to linyows/octopass/${{ matrix.pc_distro }}/${{ matrix.pc_version }}"
              package_cloud push linyows/octopass/${{ matrix.pc_distro }}/${{ matrix.pc_version }} "$pkg" || true
            fi
          done
